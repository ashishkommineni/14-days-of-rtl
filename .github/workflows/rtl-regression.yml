name: 14-day RTL regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verilator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Record simulator version
        run: verilator --version
      - name: Run fourteen-day regression
        run: make regression
      - name: Preserve compile and run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-regression-logs
          path: logs/
          if-no-files-found: warn
